<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo de Falhas (Relés)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; margin-bottom: 25px; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-top: 4px solid #34495e;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .card h3 { margin: 0 0 20px 0; color: #2c3e50; }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #bdc3c7;
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #e74c3c; } 
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>

    <h1>Painel de Controle de Falhas</h1>
    <p>Ativação e Desativação de Relés em Tempo Real</p>

    <div class="grid-container" id="painel-reles">
        <!-- Botões gerados via JavaScript -->
    </div>

    <script>
        const databaseURL = "https://firebaseio.com";
        const container = document.getElementById('painel-reles');
        const totalReles = 8;

        // Renderiza os botões imediatamente na tela (sem depender do Firebase carregar primeiro)
        for (let i = 1; i <= totalReles; i++) {
            const defectKey = `DEFEITO${i}`;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>Relé ${i} (${defectKey})</h3>
                <label class="switch">
                    <input type="checkbox" id="${defectKey}" onchange="atualizarFirebase('${defectKey}', this.checked)">
                    <span class="slider"></span>
                </label>
            `;
            container.appendChild(card);
        }

        // Envia o estado atualizado direto via requisição HTTP (Exatamente como o seu ESP32 lê)
        function atualizarFirebase(chave, status) {
            fetch(`${databaseURL}/${chave}.json`, {
                method: 'PUT',
                body: JSON.stringify(status)
            })
            .then(res => res.json())
            .then(data => console.log(`Atualizado ${chave}:`, data))
            .catch(error => console.error("Erro ao enviar comando:", error));
        }

        // Sincroniza o estado inicial dos botões com o banco de dados
        function buscarEstadosIniciais() {
            for (let i = 1; i <= totalReles; i++) {
                const defectKey = `DEFEITO${i}`;
                fetch(`${databaseURL}/${defectKey}.json`)
                    .then(res => res.json())
                    .then(valor => {
                        const checkbox = document.getElementById(defectKey);
                        if (checkbox && valor !== null) {
                            checkbox.checked = (valor === true || valor === 1 || valor === "true");
                        }
                    })
                    .catch(err => console.error("Erro ao buscar dados:", err));
            }
        }

        // Executa a busca ao carregar a página
        buscarEstadosIniciais();
        // Atualiza a cada 3 segundos para manter o painel sincronizado com mudanças externas
        setInterval(buscarEstadosIniciais, 3000);
    </script>
</body>
</html>
